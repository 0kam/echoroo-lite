name: Desktop checks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['apps/**', 'scripts/**', 'package*.json', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['apps/**', 'scripts/**', 'package*.json', '.github/workflows/desktop.yml']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: astral-sh/setup-uv@v10.3.2
      - name: Set up Python 3.11
        shell: bash
        run: |
          uv python install 3.11
          uv venv --python 3.11 --managed-python
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            echo "$GITHUB_WORKSPACE/.venv/Scripts" >> "$GITHUB_PATH"
          else
            echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          fi
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - run: uv pip install -r apps/sidecar/requirements-dev.txt
      - name: Provision the pinned BirdNET and Perch models
        run: python scripts/setup_models.py
      - run: python -m unittest discover -s apps/sidecar -p 'test_*.py'
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: python scripts/freeze_sidecar.py
      - name: Check frozen inference, search and reports with supplied audio
        run: python scripts/check_frozen.py apps/desktop/binaries/echoroo-sidecar-x86_64-pc-windows-msvc.exe --models poc/models --sample-audio scripts/fixtures/horornis-diphone-xc1177906.mp3 --diagnostics --data "$env:RUNNER_TEMP/echoroo-inference-data"
      - run: npx tauri build --config tauri.bundle.conf.json --bundles nsis
        working-directory: apps/desktop
      - uses: actions/upload-artifact@v4
        # A full artifact quota must not hide the installation check below.
        continue-on-error: true
        with:
          name: Echoroo-Lite-0.9.0-windows-x86_64
          path: apps/desktop/target/release/bundle/
      - name: Check installation and desktop preview with analysed audio
        timeout-minutes: 8
        run: scripts/check_windows_install.ps1 -Installer (Get-ChildItem 'apps/desktop/target/release/bundle/nsis/Echoroo Lite_*_x64-setup.exe' | Select-Object -First 1).FullName -Data "$env:RUNNER_TEMP/echoroo-inference-data"
      - name: Save desktop startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-startup
          path: ${{ runner.temp }}/echoroo-startup*
