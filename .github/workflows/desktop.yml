name: Desktop checks
on:
  workflow_dispatch:
  pull_request:
    paths: ['apps/**', 'scripts/**', 'package*.json', '.github/workflows/desktop.yml']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install -r apps/sidecar/requirements-dev.txt
      - run: python -m unittest discover -s apps/sidecar -p 'test_*.py'
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: python scripts/freeze_sidecar.py
      - name: Provision the pinned models for real inference
        run: python scripts/setup_models.py
      - name: Check frozen inference, search, reports and quiz with supplied audio
        run: python scripts/check_frozen.py apps/desktop/binaries/echoroo-sidecar-x86_64-pc-windows-msvc.exe --models poc/models --sample-audio apps/sidecar/data/quiz/mp3/uguisu_song_01.mp3
      - run: npm run desktop:build
      - uses: actions/upload-artifact@v4
        with:
          name: windows-preview
          path: apps/desktop/target/release/bundle/
