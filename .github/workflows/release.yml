name: Desktop release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            artifact: windows-x86_64
            installer_count: 2
          - os: macos-15
            target: aarch64-apple-darwin
            bundles: dmg
            artifact: macos-aarch64
            installer_count: 2
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            artifact: linux-x86_64
            installer_count: 4
    env:
      SIGNING_APPLE_CERTIFICATE: ${{ matrix.os == 'macos-15' && secrets.APPLE_CERTIFICATE || '' }}
      SIGNING_APPLE_CERTIFICATE_PASSWORD: ${{ matrix.os == 'macos-15' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
      SIGNING_APPLE_ID: ${{ matrix.os == 'macos-15' && secrets.APPLE_ID || '' }}
      SIGNING_APPLE_PASSWORD: ${{ matrix.os == 'macos-15' && secrets.APPLE_PASSWORD || '' }}
      SIGNING_APPLE_SIGNING_IDENTITY: ${{ matrix.os == 'macos-15' && secrets.APPLE_SIGNING_IDENTITY || '' }}
      SIGNING_APPLE_TEAM_ID: ${{ matrix.os == 'macos-15' && secrets.APPLE_TEAM_ID || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: astral-sh/setup-uv@v10
      - name: Set up Python 3.11
        shell: bash
        run: |
          uv python install 3.11
          uv venv --python 3.11 --managed-python
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            echo "$GITHUB_WORKSPACE/.venv/Scripts" >> "$GITHUB_PATH"
          else
            echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          fi
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux desktop and audio dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf libayatana-appindicator3-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good
      - run: uv pip install -r apps/sidecar/requirements-dev.txt
      - name: Provision the pinned models for both editions
        run: python scripts/setup_models.py
      - run: python -m unittest discover -s apps/sidecar -p 'test_*.py'
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: python scripts/freeze_sidecar.py
      - name: Provision Perch-only models
        shell: bash
        run: python scripts/setup_models.py --perch-only --output "$RUNNER_TEMP/echoroo-perch-models"
      - name: Select the first bundled quiz audio
        shell: bash
        run: |
          sample=$(python -c "import json, pathlib; p=pathlib.Path('apps/sidecar/data/quiz/manifest.json'); d=json.loads(p.read_text(encoding='utf-8')); print(p.parent / d['items'][0]['audio_file'])")
          echo "QUIZ_SAMPLE_AUDIO=$sample" >> "$GITHUB_ENV"
      - name: Check frozen Perch-only inference
        shell: bash
        run: python scripts/check_frozen.py "apps/desktop/binaries/echoroo-sidecar-${{ matrix.target }}${{ matrix.os == 'windows-latest' && '.exe' || '' }}" --models "$RUNNER_TEMP/echoroo-perch-models" --sample-audio "$QUIZ_SAMPLE_AUDIO" --data "$RUNNER_TEMP/echoroo-perch-data"
      - name: Prepare full-model Windows installation evidence
        if: matrix.os == 'windows-latest'
        shell: bash
        run: python scripts/check_frozen.py "apps/desktop/binaries/echoroo-sidecar-${{ matrix.target }}.exe" --models poc/models --sample-audio "$QUIZ_SAMPLE_AUDIO" --diagnostics --data "$RUNNER_TEMP/echoroo-inference-data"
      - name: Build both desktop editions
        shell: bash
        run: |
          signing_config=()
          if [[ "${{ matrix.os }}" == "macos-15" ]]; then
            if [[ -n "$SIGNING_APPLE_CERTIFICATE" && -n "$SIGNING_APPLE_CERTIFICATE_PASSWORD" && -n "$SIGNING_APPLE_SIGNING_IDENTITY" && -n "$SIGNING_APPLE_ID" && -n "$SIGNING_APPLE_PASSWORD" && -n "$SIGNING_APPLE_TEAM_ID" ]]; then
              export APPLE_CERTIFICATE="$SIGNING_APPLE_CERTIFICATE"
              export APPLE_CERTIFICATE_PASSWORD="$SIGNING_APPLE_CERTIFICATE_PASSWORD"
              export APPLE_SIGNING_IDENTITY="$SIGNING_APPLE_SIGNING_IDENTITY"
              export APPLE_ID="$SIGNING_APPLE_ID"
              export APPLE_PASSWORD="$SIGNING_APPLE_PASSWORD"
              export APPLE_TEAM_ID="$SIGNING_APPLE_TEAM_ID"
              signing_config=(--config tauri.macos-sign.conf.json)
              echo "macOS signing and notarization enabled."
            else
              echo "macOS signing secrets are incomplete; building unsigned."
            fi
          fi

          bundle_dir="apps/desktop/target/${{ matrix.target }}/release/bundle"
          mkdir -p release-assets
          stage_installers() {
            local edition="$1"
            while IFS= read -r -d '' source; do
              local name
              name=$(basename "$source")
              if [[ "$edition" == "birdnet" && "$name" != *BirdNET* ]]; then
                name="BirdNET-$name"
              fi
              cp "$source" "release-assets/$name"
            done < <(find "$bundle_dir" -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \) -print0)
          }

          (cd apps/desktop && npx tauri build --target "${{ matrix.target }}" --config tauri.bundle.conf.json "${signing_config[@]}" --bundles "${{ matrix.bundles }}")
          stage_installers standard

          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            installer=$(find "$bundle_dir/nsis" -maxdepth 1 -type f -name '*.exe' -print -quit)
            test -n "$installer"
            # Optional Windows signing belongs here once its provider and secrets are chosen;
            # guard that future setup with a non-empty-secret check before passing signCommand to Tauri.
            pwsh -NoProfile -File scripts/check_windows_install.ps1 -Installer "$installer" -Data "$RUNNER_TEMP/echoroo-inference-data"
          fi

          rm -rf "$bundle_dir"
          (cd apps/desktop && npx tauri build --target "${{ matrix.target }}" --config tauri.bundle.conf.json --config tauri.birdnet.conf.json "${signing_config[@]}" --bundles "${{ matrix.bundles }}")
          stage_installers birdnet

          count=$(find release-assets -maxdepth 1 -type f | wc -l | tr -d ' ')
          test "$count" -eq "${{ matrix.installer_count }}"
          find release-assets -maxdepth 1 -type f -name '*BirdNET*' -print -quit | grep -q .
      - uses: actions/upload-artifact@v4
        with:
          name: Echoroo-Lite-${{ matrix.artifact }}
          path: release-assets/
          if-no-files-found: error

  release:
    name: Draft GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Attach installers to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME"
          fi
          test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = true
          gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
