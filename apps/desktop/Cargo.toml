[package]
name = "echoroo-lite"
version = "0.2.0"
license = "Apache-2.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 2.13.2 or later: a failed install on macOS keeps the installed app.
tauri-plugin-updater = "2.14"
