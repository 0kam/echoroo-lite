<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Echoroo</title>
<link rel="stylesheet" href="../../apps/web/src/lib/theme.css">
<style>
*{box-sizing:border-box}body{margin:0;background:rgb(var(--color-page-bg));color:rgb(var(--stone-900));font:17px/1.6 system-ui,sans-serif}button,input,select{font:inherit}button,select,input{min-height:44px;border:1px solid rgb(var(--stone-300));border-radius:10px;background:rgb(var(--color-card-bg));color:inherit;padding:8px 14px}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}button:hover:not(:disabled){border-color:rgb(var(--primary-700))}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid rgb(var(--color-success));outline-offset:3px}.primary{background:rgb(var(--primary-700));color:white;border-color:transparent}.quiet{background:transparent}.muted{color:rgb(var(--stone-700));font-size:15px}h1{font-size:30px;line-height:1.35;margin:12px 0}h2{font-size:20px;margin:0 0 12px}p{margin:10px 0}header{border-bottom:1px solid rgb(var(--stone-300));padding:12px max(24px,calc((100vw - 1200px)/2));display:flex;align-items:center;justify-content:space-between;gap:20px}header img{width:125px;height:auto}main{max-width:1200px;margin:auto;padding:22px 24px 40px}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.between{justify-content:space-between}.card{background:rgb(var(--color-card-bg));border:1px solid rgb(var(--stone-300));border-radius:16px;padding:22px}.home{max-width:760px;margin:34px auto}.home .card{margin:24px 0}.steps{display:grid;gap:12px;padding-left:25px}.notice{border-left:3px solid rgb(var(--primary-700));padding:8px 14px;font-size:15px}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:20px;align-items:start;margin:18px 0}.workspace>.card{min-width:0}.palette{display:flex;flex-direction:column;gap:6px;max-height:396px;overflow:auto;margin:12px 0}.species{text-align:left;line-height:1.35;width:100%;min-height:58px}.species small{display:block;font-size:12px;font-style:italic;color:rgb(var(--stone-700))}.species[aria-pressed=true]{border:2px solid rgb(var(--primary-700));background:rgb(var(--primary-100));padding:7px 13px}.unknown{border-style:dashed}.full{width:100%}audio{width:100%;height:48px}.plot{position:relative;margin-top:16px;touch-action:none;cursor:crosshair;user-select:none}.plot img{display:block;width:100%;height:230px;object-fit:fill;border-radius:8px}.plot svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.ticks{display:flex;justify-content:space-between;font-size:13px;margin:3px 0 14px}.range-note{min-height:28px}.range-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-top:1px solid rgb(var(--stone-300));padding:12px 0}.range-row .name{flex:1;min-width:130px}.range-row input{width:78px;padding:8px}.range-row small{display:block;font-size:12px}.range-row button{padding:8px 11px}.footer{border-top:1px solid rgb(var(--stone-300));padding-top:18px;margin-top:20px}.check-card{margin-top:16px;background:rgb(var(--color-success-light))}.saved{color:rgb(var(--color-success));font-size:14px}dialog{max-width:600px;width:calc(100% - 32px);max-height:85vh;border:1px solid rgb(var(--stone-300));border-radius:18px;background:rgb(var(--color-card-bg));padding:24px;color:inherit}dialog::backdrop{background:#24213488}.results{max-height:50vh;overflow:auto;display:grid;gap:8px;margin:16px 0}label{display:block}.inline{display:inline}details{margin-top:16px;font-size:15px}summary{cursor:pointer;min-height:44px;padding:8px 0}[hidden]{display:none!important}.error{color:rgb(var(--color-danger))}.break{overflow-wrap:anywhere}a{color:rgb(var(--primary-700))}@media(max-width:860px){.workspace{grid-template-columns:minmax(0,1fr) 235px;gap:12px}main{padding:16px}.card{padding:16px}.plot img{height:210px}}@media(max-width:650px){.workspace{grid-template-columns:1fr}.palette{max-height:220px}.plot img{height:190px}h1{font-size:25px}}
header img{width:44px;height:38px;object-fit:contain}header{min-height:64px;padding-top:8px;padding-bottom:8px}main{padding-bottom:105px}.palette{max-height:270px}.footer{position:fixed;bottom:0;left:0;right:0;z-index:2;background:rgb(var(--color-page-bg));padding:14px max(24px,calc((100vw - 1152px)/2));margin:0}.footer p{max-width:440px;font-size:14px}.workspace{margin-top:12px}#taskTitle{margin-bottom:0}.workspace .card{padding:18px}.plot img{height:260px}@media(max-width:800px){.footer p{display:none}.palette{max-height:235px}}
.zoom-controls{margin:12px 0;gap:8px}.plot-scroll{overflow-x:auto;overscroll-behavior-x:contain;scrollbar-color:rgb(var(--stone-600)) rgb(var(--stone-200));scrollbar-width:auto}.plot-scroll::-webkit-scrollbar{height:14px}.plot-scroll::-webkit-scrollbar-thumb{background:rgb(var(--stone-600));border-radius:8px}.plot-scroll::-webkit-scrollbar-track{background:rgb(var(--stone-200))}.plot{margin-top:0}.ticks{position:relative;display:block;height:26px;margin:0}.ticks span{position:absolute;transform:translateX(-50%)}.ticks span:first-child{transform:none}.ticks span:last-child{transform:translateX(-100%)}.playhead{position:absolute;top:0;bottom:0;width:2px;background:white;box-shadow:0 0 0 1px #30263d;pointer-events:none}.recorded-species{padding:12px 0;border-bottom:1px solid rgb(var(--stone-300))}.recorded-species small{display:block}.path{font-size:14px;color:rgb(var(--stone-700));margin:8px 0}.review{max-width:860px;margin:auto}.review>.card{margin:20px 0}.review select{width:100%;margin:8px 0}.step-note{font-size:15px;max-width:850px}.range-error{min-height:0}

.spectrogram-grid{display:grid;grid-template-columns:68px minmax(0,1fr);gap:4px 8px;align-items:stretch}.plot-scroll{height:240px;overflow:scroll;overscroll-behavior:contain}.plot-scroll::-webkit-scrollbar{width:14px;height:14px}#plotTrack,.plot{height:100%;min-height:100%}.plot img{height:100%;border-radius:0}.plot svg{overflow:visible}.zoom-controls>button:first-child,.zoom-controls>button:nth-child(2){min-width:44px}.zoom-axis{position:relative;font-size:13px;cursor:zoom-in;color:rgb(var(--stone-700));border-radius:6px;background:rgb(var(--stone-100))}.zoom-axis:hover{background:rgb(var(--stone-200))}.zoom-axis:focus-visible,.plot-scroll:focus-visible{outline:3px solid rgb(var(--color-success));outline-offset:2px}.frequency-axis>span{position:absolute;left:2px;top:50%;writing-mode:vertical-rl;transform:translateY(-50%)}#frequencyTicks{position:absolute;inset:0 5px 0 28px}#frequencyTicks span{position:absolute;right:0;transform:translateY(-50%)}#frequencyTicks span:first-child{transform:none}#frequencyTicks span:last-child{transform:translateY(-100%)}.time-axis{min-height:48px;text-align:center;padding:0 3px}.time-axis .ticks{height:23px;text-align:left}.time-axis>span{font-size:12px}.zoom-controls .muted{font-variant-numeric:tabular-nums}
</style>
<header><img src="../../apps/web/static/echoroo.png" alt="Echoroo"><div class="row"><span class="muted" data-msg="prototype"></span><label><span hidden data-msg="language"></span><select id="locale" aria-label="Language"><option value="ja">日本語</option><option value="en">English</option></select></label></div></header>
<main>
 <p id="loading" role="status"></p>
 <section id="home" class="home" hidden>
  <p class="muted site"></p><h1 data-msg="title"></h1>
  <p data-msg="intro"></p>
  <div class="card"><h2 data-msg="threeSteps"></h2><ol class="steps"><li data-msg="step1"></li><li data-msg="step2"></li><li data-msg="step3"></li></ol><p class="muted" data-msg="paletteHint"></p><p id="progress"></p><div class="row"><button id="start" class="primary"></button><button id="openReview" data-msg="reviewTitle" hidden></button></div></div>
  <p class="notice" data-msg="scopeNote"></p>
 </section>
 <section id="review" class="review" hidden>
  <button id="reviewHome" class="quiet" data-msg="backHome"></button><p class="muted site"></p><h1 data-msg="reviewTitle"></h1>
  <p data-msg="reviewIntro"></p><div id="recordedSpecies"></div>
  <div class="card"><h2 data-msg="qualityTitle"></h2><p data-msg="qualityWhy"></p><label for="qualitySpecies" data-msg="qualitySpecies"></label><select id="qualitySpecies"></select><p id="qualityCounts" class="muted"></p><button id="beginCheck" data-msg="beginCheck"></button><p class="muted" data-msg="qualityPrototype"></p></div>
  <div class="row"><button id="continueRecording" class="primary" data-msg="continueRecording"></button><button id="download" data-msg="download"></button></div>
 </section>
 <section id="editor" hidden>
  <div class="row between"><div class="row"><button id="back" class="quiet" data-msg="back"></button><span class="muted site"></span></div><span id="saved" class="saved" role="status"></span></div>
  <div class="row between"><h1 id="taskTitle"></h1><div><strong id="position"></strong><p class="muted" id="timestamp"></p></div></div>
  <p id="targetScientific" class="muted" hidden></p><p id="stageNote" class="step-note" hidden></p>
  <div class="workspace">
   <section class="card">
    <audio id="player" controls preload="metadata"></audio>
    <div class="row zoom-controls"><button id="zoomOut" aria-label="Zoom out">−</button><button id="zoomIn" aria-label="Zoom in">＋</button><button id="zoomFit" data-msg="zoomFit"></button><span class="muted" data-msg="zoomShort"></span><span id="viewLabel" class="muted" role="status"></span><button id="playView" data-msg="playView" hidden></button></div>
    <div class="spectrogram-grid">
     <div id="frequencyAxis" class="frequency-axis zoom-axis" tabindex="0" role="group"><span id="frequencyTitle" data-msg="frequencyAxis"></span><div id="frequencyTicks" aria-hidden="true"></div></div>
     <div id="plotScroll" class="plot-scroll" tabindex="0" role="group"><div id="plotTrack"><div class="plot" id="plot"><img id="spectrogram" alt="" draggable="false"><svg id="marks" aria-hidden="true"></svg><div id="playhead" class="playhead" aria-hidden="true"></div></div></div></div>
     <div></div><div id="timeAxis" class="time-axis zoom-axis" tabindex="0" role="group"><div id="ticks" class="ticks" aria-hidden="true"></div><span data-msg="timeAxis"></span></div>
    </div>
    <p class="muted" data-msg="zoomHint"></p>
    <p id="panHint" class="muted" data-msg="panHint" hidden></p>
    <p id="instruction" class="range-note"></p>
    <div id="ranges"></div>
    <details id="keyboard"><summary data-msg="keyboard"></summary><div class="row"><label><span data-msg="startTime"></span><input id="from" type="number" min="0" max="15" step=".1" value="0"></label><label><span data-msg="endTime"></span><input id="to" type="number" min="0" max="15" step=".1" value="1"></label><button id="addRange" data-msg="addRange"></button></div><p id="rangeError" class="error" role="alert"></p></details>
    <div id="checkCard" class="card check-card" hidden><h2 id="checkQuestion"></h2><p class="muted" id="checkHelp"></p><div class="row" id="answers"><button data-answer="present" data-msg="present"></button><button data-answer="absent" data-msg="absent"></button><button data-answer="unknown" data-msg="uncertain"></button></div><p id="checkAnswer" class="saved" role="status"></p></div>
   </section>
   <aside class="card" id="speciesPanel"><h2 data-msg="listTitle"></h2><p class="muted" data-msg="listHint"></p><label><span hidden data-msg="filter"></span><input class="full" id="filter" type="search"></label><div id="palette" class="palette"></div><button id="unknown" class="species unknown" data-msg="unknown"></button><button id="openCatalog" class="quiet full" style="margin-top:10px" data-msg="addSpecies"></button></aside>
  </div>
  <div class="footer row between"><button id="previous" data-msg="previous"></button><p class="muted" id="footerNote"></p><button id="next" class="primary"></button></div>
 </section>
</main>
<dialog id="catalogDialog"><div class="row between"><h2 data-msg="addSpecies"></h2><button id="closeCatalog" data-msg="close"></button></div><p data-msg="catalogHint"></p><label><span hidden data-msg="speciesName"></span><input id="catalogQuery" class="full" type="search"></label><div id="catalogResults" class="results"></div><p id="catalogCount" class="muted"></p></dialog>
<dialog id="recordDialog"><div class="row between"><h2 data-msg="download"></h2><button id="closeRecord" data-msg="close"></button></div><p class="muted" data-msg="recordHint"></p><textarea id="recordJSON" readonly rows="12" class="full" style="font:13px/1.6 monospace;padding:12px;border:1px solid #bbb;border-radius:8px" aria-label="JSON"></textarea><button id="copyRecord" class="primary" data-msg="copy"></button><p id="copyStatus" role="status"></p></dialog>
<script type="module" src="annotation.js"></script>
</html>
