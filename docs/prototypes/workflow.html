@media(max-width:760px){main{padding:0 16px 40px}.grid{grid-template-columns:1fr}h1{font-size:23px}.card{padding:18px}td,th{padding:12px 7px}.stats{gap:12px}.row button{white-space:normal}}

},

hits:'Listen to similar sounds', hitHint:'Most similar sounds appear first. Listen to decide whether they contain the target species.', target:'Target species', other:'Different sound', unknown:'Cannot tell', confirmed:'The sound confirmed through search has been added to the results.', notConfirmed:'The target species was not confirmed in this review.', returnSpecies:'Return to species results', sampling:'Choose sounds to review', low:'Minimum similarity', high:'Maximum', count:'Number of sounds', sample:'Sample this range', sampled:'Example sample from selected range', searchCaution:'Sounds confirmed through search are not added to AI detection frequency.',
validation:'Evaluate detection quality', valIntro:'Review a sample of recordings for this species, including intervals where AI did not detect it.', scope:'Scope: North green space · 2026 recordings · selected species', plan:'Review 10 short sounds at a time', planHint:'Ten sounds is a work batch. Total evaluation size and acceptance criteria remain to be agreed.', start:'Start reviewing', question:'Can you hear the target species in this interval?', yes:'Heard', no:'Not heard', saved:'Answered (prototype)', pause:'Pause and return to species', valDone:'This review batch is complete', insufficient:'Insufficient validation', insufficientHint:'This prototype does not calculate quality. The app will not finalise estimates or recommended thresholds without enough evidence.', valProgress:'Review in progress',

}};
let lang='ja', selected='uguisu', model='BirdNET', refs=0, source='', returnTo='species', searchVerdict='', sampled=false, speciesQuery='';
const validation = {}, found=new Set(), extra=new Set(), excluded=new Set();
const taxa={uguisu:'Horornis diphone',tit:'Parus minor',bulbul:'Hypsipetes amaurotis',bamboo:'Bambusicola thoracicus',cuckoo:'Cuculus canorus',kingfisher:'Alcedo atthis',crow:'Corvus macrorhynchos'};
const t=k=>messages[lang][k]??messages.en[k]??k;
const escape=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const name=k=>`${escape(t(k))} <i>${escape(taxa[k])}</i>`;
const link=(route,label,primary=false)=>`<a class="button ${primary?'primary':''}" href="#${route}">${t(label)}</a>`;
const button=(action,label,primary=false)=>`<button data-action="${action}" class="${primary?'primary':''}">${t(label)}</button>`;
const done=()=>validation[selected]?.length??0;
const qualityFor=k=>(validation[k]?.length??0)===10?'insufficient':validation[k]?.length?'valProgress':'unevaluated';
const state=()=>qualityFor(selected);
const audio=(label='audio')=>`<div class="audio"><div class="waves" aria-hidden="true">${Array.from({length:40},(_,i)=>`<b style="height:${8+(Math.sin(i*2.7)+1)*24}px"></b>`).join('')}</div><strong>${t(label)}</strong><div class="muted">${t('noAudio')}</div></div>`;
function spiral(){let d='';for(let i=0;i<500;i++){const a=i/499*Math.PI*18,r=12+i/499*105;d+=`${i?'L':'M'}${(140+r*Math.cos(a)).toFixed(2)},${(135+r*Math.sin(a)).toFixed(2)} `;}return `<div class="chart"><svg viewBox="0 0 280 275" role="img" aria-label="${t('chartNote')}"><path d="${d}" fill="none" stroke="rgb(var(--primary-500))" stroke-width="5"/><circle cx="140" cy="135" r="7" fill="rgb(var(--primary-700))"/></svg><p class="muted">${t('chartNote')}</p></div>`;}
const normalize=text=>text.normalize('NFKC').trim().toLowerCase();
function matchingSpecies(query){
  const q=normalize(query);
  if(!q)return [];
  return Object.keys(taxa).map(k=>{
    const names=[messages.ja[k],messages.en[k],taxa[k]].filter(Boolean).map(normalize);
    return [k,names.some(n=>n===q)?0:names.some(n=>n.startsWith(q))?1:names.some(n=>n.includes(q))?2:3];
  }).filter(([,rank])=>rank<3).sort((a,b)=>a[1]-b[1]||t(a[0]).localeCompare(t(b[0]),lang)).map(([k])=>k);
}
function showSpeciesMatches(){
  const results=document.querySelector('#species-results');
  if(!results)return;
  const matches=matchingSpecies(speciesQuery);
  results.innerHTML=!speciesQuery.trim()?'':matches.length?matches.map(k=>`<button data-choose="${k}" class="choice" style="width:100%;justify-content:flex-start">${name(k)}</button>`).join(''):`<p role="status">${t('noSpecies')}</p><details><summary>${t('addSpeciesName')}</summary><form id="add-species" class="spaced"><label>${t('commonLabel')}<br><input name="common" value="${escape(speciesQuery.trim())}" maxlength="120" required></label><label>${t('scientificLabel')}<br><input name="scientific" maxlength="120" required></label><button type="submit" class="primary spaced">${t('next')}</button></form></details>`;
}
function chooseSpecies(k){selected=k;extra.add(k);source='';refs=0;searchVerdict='';sampled=false;speciesQuery='';location.hash='search';}
function render(){
document.documentElement.lang=lang;document.querySelector('#notice').textContent=t('notice');
const route=location.hash.slice(1)||'home', keys=[...new Set(['uguisu','tit','bulbul',...extra])];
let body='';
if(route==='home') body=`<div class="row between"><div><h1>${t('dataset')}</h1><p class="muted">${t('period')}</p></div>${link('export','export',true)}</div><div class="row stats"><span class="badge blue">${t('complete')}</span><span><strong>17,520 / 17,520</strong>${t('files')}</span><span><strong>292 h</strong>${t('hours')}</span>${link('recordings','recordings')}</div><section class="card"><div class="row between"><h2>${t('species')}</h2>${link('find','missing')}</div><p class="muted">${t('overviewHint')}</p><div class="table"><table><thead><tr><th>${t('species')}</th><th>${t('ai')}</th><th>${t('evidence')}</th><th>${t('quality')}</th></tr></thead><tbody>${keys.map((k,i)=>`<tr><td><a href="#species" data-species="${k}">${name(k)}</a></td><td>${i<3?`BirdNET: ${[126,92,164][i]} ${t('days')}<br>Perch: ${[80,64,112][i]} ${t('days')}`:'—'}</td><td>${found.has(k)?`1 ${t('sounds')}`:t('none')}</td><td><span class="badge">${t(qualityFor(k))}</span></td></tr>`).join('')}</tbody></table></div></section>`;
else if(route==='species') body=`<div class="row between"><h1>${name(selected)}</h1>${link('search','further')}</div><div class="grid"><section class="card"><h2>${t('season')}</h2><div class="row" aria-label="${t('model')}">${['BirdNET','Perch'].map(m=>`<button data-model="${m}" aria-pressed="${model===m}" class="${model===m?'active':''}">${m}</button>`).join('')}</div>${!['uguisu','tit','bulbul'].includes(selected)?`<p class="callout">${t('noDetection')}</p>`:spiral()}<p>${model} · ${t('unevaluated')}</p></section><section class="card"><h2>${t('quality')}</h2><span class="badge">${t(state())}</span><p>${t(done()===10?'insufficientHint':'qualityHint')}</p>${link(done()?'review':'validation',done()?'continue':'validate',true)}<div class="spaced">${button('practice','learn')}</div><details><summary>${t('ai')}</summary><p>BirdNET · ${t('unevaluated')}<br>Perch · ${t('unevaluated')}</p><p class="muted">${t('example')}</p></details></section></div><section class="card"><h2>${t(found.has(selected)?'evidence':'aiAudio')}</h2>${found.has(selected)?`<p class="badge blue">1 ${t('sounds')}</p>`:''}${!['uguisu','tit','bulbul'].includes(selected)&&!found.has(selected)?`<p>${t('noDetection')}</p>`:audio()}<p class="muted">${t('searchCaution')}</p></section>`;
else if(route==='find') body=`<div class="narrow"><h1>${t('find')}</h1><p>${t('findHint')}</p><section class="card"><label>${t('speciesLabel')}<br><input id="species-picker" type="search" autocomplete="off" maxlength="120" style="width:100%" value="${escape(speciesQuery)}" placeholder="${t('searchPlaceholder')}" aria-describedby="species-help"></label><p id="species-help" class="muted">${t('searchNamesHint')}</p><div id="species-results" class="spaced"></div></section></div>`;
else if(route==='search') body=`<div class="narrow"><h1>${t('reference')}</h1><p>${name(selected)}</p><p>${t('referenceHint')}</p><section class="card"><div class="row">${button('xc','xc')}${button('pc','pc')}</div>${source?`<div class="spaced">${source==='XC'?`<div class="row"><label>${t('country')}<br><select><option>${t('japan')}</option><option>${t('any')}</option></select></label><label>${t('xcQuality')}<br><select><option>A</option><option>B</option><option>C</option></select></label></div>`:''}<p>${t('selected')} · ${source} · ${t('example')}</p>${audio()}<p><strong>${t('range')}</strong></p><p class="muted">${t('rangeHint')}</p><div class="row"><span>${t('refs')}: ${refs}</span>${button('add-ref','addRef')}${link('find','addSpecies')}</div></div>`:''}</section><p class="muted">${t('searchHint')}</p>${source?link('hits','search',true):''}</div>`;
else if(route==='hits') body=`<div class="narrow"><h1>${t('hits')}</h1><p>${name(selected)}</p><p>${t('hitHint')}</p><section class="card"><h2>${t(sampled?'sampled':'example')} · 1</h2>${audio()}<div class="row">${button('target','target',true)}${button('other','other')}${button('unknown','unknown')}</div>${searchVerdict?`<p class="callout" role="status">${t(searchVerdict==='target'?'confirmed':'notConfirmed')}</p>${link('species','returnSpecies')}`:''}<details><summary>${t('sampling')}</summary><form id="sampling" class="spaced"><div class="row"><label>${t('low')}<br><input id="low" type="number" min="-1" max="1" step="0.1" value="0.3" required></label><label>${t('high')}<br><input id="high" type="number" min="-1" max="1" step="0.1" value="0.8" required></label><label>${t('count')}<br><input type="number" min="1" max="200" value="10" required></label></div><button type="submit" class="spaced">${t('sample')}</button></form></details></section></div>`;
else if(route==='validation') body=`<div class="narrow"><h1>${t('validation')}</h1><p>${name(selected)}</p><p>${t('valIntro')}</p><section class="card"><p>${t('scope')}</p><h2>${t('plan')}</h2><p>${t('planHint')}</p>${link('review','start',true)}</section>${button('practice','learn')}</div>`;
else if(route==='review') body=`<div class="narrow"><h1>${name(selected)}</h1><p>${done()} / 10 · ${t('saved')}</p><progress max="10" value="${done()}"></progress>${done()<10?`<section class="card"><h2>${t('question')}</h2>${audio()}<div class="row">${button('yes','yes',true)}${button('no','no')}${button('unsure','unknown')}</div></section><div class="row">${link('species','pause')}${button('practice','learn')}</div>`:`<section class="card"><h2>${t('valDone')}</h2><span class="badge">${t('insufficient')}</span><p>${t('insufficientHint')}</p>${link('species','returnSpecies',true)}</section>`}</div>`;
else if(route==='practice') body=`<div class="narrow"><h1>${t('practice')}</h1><p>${name(selected)}</p><section class="card">${audio('practiceAudio')}<p>${t('practiceHint')}</p>${link(returnTo,'backWork',true)}</section></div>`;
else if(route==='export') body=`<h1>${t('exportTitle')}</h1><p>${t('period')}</p><p>${t('exportHint')}</p><div class="grid"><section class="card"><h2>${t('include')}</h2>${keys.map(k=>`<label class="choice"><input type="checkbox" data-include="${k}" ${excluded.has(k)?'':'checked'}><span>${name(k)}</span><span class="badge">${t(qualityFor(k))}</span></label>`).join('')}</section><section class="card"><h2>${t('package')}</h2><p>${t('packageText')}</p><p class="callout">${t('unverified')}</p>${link('output','exportPreview',true)}</section></div>`;
else if(route==='output') body=`<div class="narrow"><h1>${t('output')}</h1><p>${t('outputHint')}</p><section class="card"><h2>${t('selectedCount')}: ${keys.filter(k=>!excluded.has(k)).length}</h2>${keys.filter(k=>!excluded.has(k)).map(k=>`<p>${name(k)} · ${t(qualityFor(k))}</p>`).join('')}<p>${t('packageText')}</p><p class="callout">${t('checked')}</p>${link('export','back')}</section></div>`;
else if(route==='recordings') body=`<h1>${t('recordings')}</h1><p>${t('recordsHint')}</p><section class="card"><div class="table"><table><thead><tr><th>${t('filename')}</th><th>${t('duration')}</th><th>${t('ai')}</th></tr></thead><tbody>${[0,1,2].map(i=>`<tr><td>20260101_0${i}0000.wav</td><td>01:00</td><td>${t('complete')}</td></tr>`).join('')}</tbody></table></div><p class="muted">${t('example')}</p></section>`;
else {location.hash='home';return;}
document.querySelector('#app').innerHTML=`${route==='home'?'':`<a href="#home">‹ ${t('home')}</a>`}${body}<footer>${t('notice')}</footer>`;
showSpeciesMatches();
}
document.querySelector('#locale').addEventListener('change',e=>{lang=e.target.value;render();});
document.addEventListener('click',e=>{const el=e.target.closest('[data-action],[data-species],[data-model],[data-choose]');if(!el)return;
if(el.dataset.choose){chooseSpecies(el.dataset.choose);return;}
if(el.dataset.species){selected=el.dataset.species;render();return;}
if(el.dataset.model){model=el.dataset.model;render();return;}
const action=el.dataset.action;
if(action==='xc'||action==='pc'){source=action==='xc'?'XC':'PC';refs=Math.max(1,refs);render();}
else if(action==='add-ref'){refs++;render();}
else if(action==='practice'){returnTo=location.hash.slice(1)||'species';location.hash='practice';}
else if(['yes','no','unsure'].includes(action)){validation[selected]??=[];if(done()<10)validation[selected].push(action);render();}
else if(['target','other','unknown'].includes(action)){searchVerdict=action;if(action==='target'){found.add(selected);extra.add(selected);}else found.delete(selected);render();}
});
document.addEventListener('input',e=>{if(e.target.id==='species-picker'){speciesQuery=e.target.value;showSpeciesMatches();}});
document.addEventListener('change',e=>{if(e.target.dataset.include){const k=e.target.dataset.include;e.target.checked?excluded.delete(k):excluded.add(k);}});
document.addEventListener('submit',e=>{if(e.target.id==='add-species'){e.preventDefault();const data=new FormData(e.target),common=String(data.get('common')).trim(),sci=String(data.get('scientific')).trim();if(!common||!sci)return;const existing=Object.keys(taxa).find(k=>normalize(taxa[k])===normalize(sci));const k=existing??`custom-${Object.keys(taxa).length}`;if(!existing){taxa[k]=sci;messages.ja[k]=common;messages.en[k]=common;}chooseSpecies(k);return;}if(e.target.id==='sampling'){e.preventDefault();const low=document.querySelector('#low'),high=document.querySelector('#high');if(+low.value>+high.value){high.min=low.value;high.reportValidity();return;}sampled=true;searchVerdict='';render();}});
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0);document.querySelector('h1')?.setAttribute('tabindex','-1');document.querySelector('h1')?.focus({preventScroll:true});});
render();
</script>
</html>
